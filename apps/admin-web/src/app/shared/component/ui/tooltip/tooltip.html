<span
  class="relative inline-block hover:cursor-alias max-w-full"
  (mouseenter)="onPointerEnter()"
  (mouseleave)="onPointerLeave()"
>
  <span
    class="absolute -top-10 left-1/2 -translate-x-1/2 z-10 bg-info text-info-foreground text-sm px-3 py-1.5 rounded-md shadow-lg transition-opacity duration-300 ease-in-out w-max max-w-5/6 whitespace-normal text-center"
    [class]="isHovered() ? '' : 'opacity-0 pointer-events-none'"
    role="tooltip"
  >
    {{ text() }}
  </span>
  <ng-content></ng-content>
</span>
